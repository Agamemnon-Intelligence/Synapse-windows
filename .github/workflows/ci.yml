name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit and integration tests
        run: dotnet test tests/Synapse.Core.Tests
      - name: Markdown renderer smoke test
        run: node tests/ui/markdown.test.mjs

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build app, CLI and portable zip
        shell: pwsh
        run: ./build.ps1 -SkipInstaller
      - uses: actions/upload-artifact@v4
        with:
          name: Synapse-win-x64-portable
          path: dist/*.zip
